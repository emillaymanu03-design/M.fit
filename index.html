<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M.Fit</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f2a4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="M.Fit">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: coluna única mobile, cabeçalho marinho, menu inferior com botão central de treino */
:root{--navy:#0f2a4a;--navy2:#1c4373;--sky:#8cc8f2;--skybg:#e8f4fd;--bg:#fff;--soft:#f3f5f8;--line:#e1e6ed;--muted:#5d6b7e;--ok:#1d7a52;--bad:#b3362f;
--disp:'Barlow Semi Condensed',system-ui,sans-serif;--body:'Figtree',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html.big{font-size:112.5%}
body{background:var(--bg);color:var(--navy);font:400 .95rem/1.45 var(--body);padding-bottom:calc(92px + env(safe-area-inset-bottom))}
body.resting{padding-bottom:calc(240px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
header{background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;z-index:5}
.hrow{max-width:720px;margin:auto;display:flex;align-items:center;gap:8px}
header h1{font:700 1.15rem/1.15 var(--disp);flex:1;min-width:0;display:flex;flex-direction:column}
.brand{font:700 1.6rem/1 var(--disp);font-style:italic;letter-spacing:.01em}
.brand i{color:var(--sky)}
#title{font:600 .78rem var(--body);color:var(--sky)}
#title:empty{display:none}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.days .chip{padding:6px 0;min-width:0;border-radius:9px}
.cal button.live{background:var(--skybg);color:var(--navy);border:2px dashed var(--navy2)}
.cal button.live small{color:var(--navy2);font-size:.65rem}
#sync{font-size:.72rem;color:var(--sky);text-align:right;max-width:42%}
header button{width:40px;height:40px;border-radius:10px;display:grid;place-items:center}
header button:hover{background:var(--navy2)}
main{max-width:720px;margin:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
h2{font:700 1.6rem/1.15 var(--disp);text-wrap:balance}
h3{font:600 1.15rem/1.2 var(--disp)}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.hero{background:var(--navy);border-color:var(--navy);color:#fff}
.hero .muted{color:var(--sky)}
.card.soft{background:var(--soft);border-color:var(--soft)}
.card.tint{background:var(--skybg);border-color:var(--skybg)}
.muted{color:var(--muted);font-size:.84rem}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{min-height:44px;padding:8px 14px;border-radius:10px;background:var(--navy);color:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.sec{background:var(--skybg);color:var(--navy)}
.btn.line{background:#fff;border:1px solid var(--line);color:var(--navy)}
.btn.bad{background:#fff;border:1px solid var(--line);color:var(--bad)}
.hero .btn{background:#fff;color:var(--navy)}
.btn.sm{min-height:36px;padding:4px 10px;font-size:.82rem}
.btn.block{width:100%}
.ib{min-width:38px;min-height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:700;color:var(--navy)}
.ib:disabled{opacity:.35}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:.84rem;font-weight:600;min-height:36px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.done{background:var(--skybg);border-color:var(--sky)}
.chip.on.done{background:var(--navy)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat b{display:block;font:700 1.7rem/1.1 var(--disp);font-variant-numeric:tabular-nums}
.grid3 .card{padding:10px 8px}.grid3 .stat b{font-size:1.35rem;overflow-wrap:anywhere}
.stat span{font-size:.75rem;color:var(--muted)}
label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--navy);font-size:1rem;font-weight:500}
textarea{min-height:68px;resize:vertical}
label.check{flex-direction:row;align-items:center;gap:10px;color:var(--navy);font-size:.92rem}
label.check input{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--navy)}
.item{display:flex;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
button.item{width:100%;text-align:left}
.pill{display:inline-block;background:var(--skybg);border-radius:99px;padding:2px 9px;font-size:.72rem;font-weight:700}
.pill.warn{background:#fff1d6;color:#7a5200}
.letter{width:42px;height:42px;border-radius:11px;background:var(--navy);color:#fff;display:grid;place-items:center;font:700 1.3rem var(--disp);flex:none}
.hero .letter{background:#fff;color:var(--navy)}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy2)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:.72rem;color:var(--muted)}
.week i{display:block;height:34px;border-radius:8px;background:var(--soft);margin-bottom:3px}
.week i.on{background:var(--navy)}
.week i.today{box-shadow:inset 0 0 0 2px var(--sky)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal span{text-align:center;font-size:.72rem;color:var(--muted);font-weight:700}
.cal button{aspect-ratio:1;border-radius:10px;background:var(--soft);font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;line-height:1.1}
.cal button.on{background:var(--navy);color:#fff}
.cal button.on small{color:var(--sky);font-size:.65rem}
.cal button.today{box-shadow:0 0 0 2px var(--sky)}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 52px;gap:8px;align-items:center}
.setrow input{text-align:center;font:700 1.25rem var(--disp);font-variant-numeric:tabular-nums}
.setrow.head{font-size:.72rem;color:var(--muted);font-weight:700;text-align:center}
.setrow.done input{background:var(--skybg);border-color:var(--sky)}
.tick{height:46px;border-radius:11px;border:2px solid var(--line);font-size:1.3rem;font-weight:700;color:transparent}
.setrow.done .tick{background:var(--navy);border-color:var(--navy);color:#fff}
.clock{font:700 2.4rem/1 var(--disp);font-variant-numeric:tabular-nums}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav div{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.68rem;font-weight:600;color:var(--muted);min-width:0}
nav button.on{color:var(--navy);box-shadow:inset 0 3px 0 var(--navy)}
nav .go span{width:54px;height:54px;margin-top:-26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;border:4px solid var(--sky)}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#rest{position:fixed;left:8px;right:8px;bottom:calc(72px + env(safe-area-inset-bottom));max-width:704px;margin:auto;background:var(--navy);color:#fff;border-radius:16px;padding:12px;z-index:7;box-shadow:0 8px 28px #0f2a4a55}
#rest .btn{background:var(--navy2);min-height:38px;padding:4px 8px;font-size:.82rem;flex:1}
#rest.end{background:var(--sky);color:var(--navy)}
#rest.end .btn{background:var(--navy);color:#fff}
#rest .clock{font-size:2.8rem}
.overlay{position:fixed;inset:0;background:#0f2a4a80;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:720px;max-height:92%;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.sheet>.top{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet>.body{overflow-y:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
#dialog{align-items:center;padding:16px;z-index:30}
#dialog .sheet{border-radius:16px;max-width:420px;padding:18px;gap:12px;overflow-y:auto}
#toast{position:fixed;top:calc(68px + env(safe-area-inset-top));left:16px;right:16px;max-width:520px;margin:auto;z-index:40;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#toast div{background:var(--skybg);border:1px solid var(--sky);border-radius:12px;padding:11px 14px;font-weight:600;box-shadow:0 6px 20px #0f2a4a30}
.chart{width:100%;height:auto;display:block}
.chart text{font:600 11px var(--body);fill:var(--muted)}
.banner{background:#fff1d6;border-radius:12px;padding:10px 12px;font-size:.85rem}
[hidden]{display:none!important}
#auth{min-height:100vh;min-height:100dvh}
.authhead{background:var(--navy);color:var(--sky);padding:calc(44px + env(safe-area-inset-top)) 24px 28px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.authhead .brand{font-size:3.4rem;color:#fff}
.authbody,#authform{display:flex;flex-direction:column;gap:12px}
.authbody{max-width:420px;margin:auto;padding:20px 16px calc(32px + env(safe-area-inset-bottom))}
body.locked{padding-bottom:0}
body.locked>header,body.locked>main,body.locked>nav,body.locked>#rest{display:none}
button,nav{-webkit-tap-highlight-color:transparent}
</style>
</head>
<body class="locked">
<div id="auth"></div>
<header><div class="hrow"><h1><span class="brand">M<i>.</i>Fit</span><span id="title"></span></h1><span id="sync" role="status"></span>
<button data-act="go" data-v="historico" aria-label="Histórico" id="bHist"></button><button data-act="go" data-v="ajustes" aria-label="Ajustes" id="bCfg"></button></div></header>
<main id="main"></main>
<div id="rest" hidden></div>
<nav><div id="nav"></div></nav>
<div id="sheets"></div>
<div id="dialog" class="overlay" hidden></div>
<div id="toast" aria-live="polite"></div>
<script>
'use strict';
const PWA=true,ONLINE=false;
/* ===== utilidades ===== */
const $=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const dateOf=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c,12)};
const br=s=>s?s.split('-').reverse().join('/'):'';
const brs=s=>br(s).slice(0,5);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const hm=ts=>ts?pad(new Date(ts).getHours())+':'+pad(new Date(ts).getMinutes()):'';
const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const GROUPS=['Peito','Costas','Ombros','Bíceps','Tríceps','Quadríceps','Posterior de coxa','Glúteos','Panturrilhas','Abdômen','Cardio','Outro'];
const RESTS=[30,45,60,90,120,180];
function dur(sec){if(sec==null)return '—';const m=Math.round(sec/60),h=Math.floor(m/60);return h?h+'h'+pad(m%60)+'min':m+'min'}
function clock(sec){sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor(sec/60)%60,s=sec%60;return (h?h+':':'')+pad(m)+':'+pad(s)}
function num(v){if(v===''||v==null)return null;const n=Number(String(v).replace(',','.'));return Number.isFinite(n)&&n>=0?n:null}
const firstInt=v=>{const m=String(v??'').match(/\d+/);return m?Number(m[0]):null};

/* ===== armazenamento somente no aparelho (IndexedDB) ===== */
const COLS=['fichas','sessions','measures','photos','state'];
const S={data:{}};COLS.forEach(c=>S.data[c]={});
const Sync={mode:'local',seen:new Set(),pending:0,failed:new Set(),err:''};
let idb=null;
const channel='BroadcastChannel' in window?new BroadcastChannel('mfit'):null;
function openDB(){
  return idb||=new Promise((ok,no)=>{
    const r=indexedDB.open('mfit',1);
    r.onupgradeneeded=()=>{r.result.createObjectStore('docs');r.result.createObjectStore('meta')};
    r.onsuccess=()=>{const d=r.result;d.onclose=()=>{idb=null};d.onversionchange=()=>{d.close();idb=null};ok(d)};
    r.onerror=()=>{idb=null;no(r.error)};
  });
}
async function run(store,mode,fn){
  for(let attempt=0;;attempt++){
    const d=await openDB();
    try{
      return await new Promise((ok,no)=>{
        const t=d.transaction(store,mode,{durability:'strict'}),req=fn(t.objectStore(store));
        t.oncomplete=()=>ok(req?.result);t.onerror=t.onabort=()=>no(t.error||new Error('abort'));
      });
    }catch(e){if(attempt||e.name!=='InvalidStateError')throw e;idb=null}
  }
}
/* grava o estado atual de um documento (ou o remove, se não existir mais) */
async function persist(k){
  const[c,id]=k.split('/');Sync.pending++;syncLabel();
  const doc=S.data[c][id]?structuredClone(S.data[c][id]):null;
  try{await run('docs','readwrite',s=>doc?s.put(doc,k):s.delete(k));Sync.failed.delete(k);if(!Sync.failed.size)Sync.err='';channel?.postMessage(k)}
  catch(e){Sync.failed.add(k);Sync.err='Erro ao salvar';toast('Não foi possível salvar no aparelho. Libere espaço no celular e baixe um backup em Ajustes.',8000)}
  Sync.pending--;syncLabel();
}
const get=(c,id)=>S.data[c][id];
const all=c=>Object.values(S.data[c]);
function put(c,doc){doc.updatedAt=Date.now();S.data[c][doc.id]=doc;persist(c+'/'+doc.id)}
function del(c,id){delete S.data[c][id];persist(c+'/'+id)}
function flush(){for(const k of Sync.failed)persist(k)}
async function loadAll(){
  const found=[];
  await run('docs','readonly',s=>{s.openCursor().onsuccess=e=>{const c=e.target.result;if(c){found.push([c.key,c.value]);c.continue()}};return null});
  COLS.forEach(c=>S.data[c]={});
  for(const[k,v]of found){const c=k.split('/')[0];if(S.data[c])S.data[c][v.id]=v}
}
function syncLabel(){const el=$('#sync');if(el)el.textContent=Sync.err||(Sync.pending?'Salvando…':'Salvo no aparelho')}
/* ===== regras de treino ===== */
const DEF={id:'settings',name:'',defaultRest:90,sound:true,vibrate:true,banner:true,autoRest:false,unit:'kg',weekStart:1,big:false,measures:true,activeFicha:null,custom:[]};
const cfg=()=>({...DEF,...get('state','settings')});
function setCfg(p){put('state',{...cfg(),...p})}
const LB=2.2046226218;
const toU=kg=>kg==null?null:Math.round((cfg().unit==='lb'?kg*LB:kg)*100)/100;
const fromU=v=>{const n=num(v);return n==null?null:cfg().unit==='lb'?n/LB:n};
const nf=n=>n==null?'—':n.toLocaleString('pt-BR',{maximumFractionDigits:2});
/* valor para campos de digitação, com vírgula decimal */
const iu=kg=>kg==null?'':String(toU(kg)).replace('.',',');
const wt=kg=>kg==null?'—':nf(toU(kg))+' '+cfg().unit;
const restOf=e=>e.rest||cfg().defaultRest;
const fichas=()=>all('fichas').sort((a,b)=>a.createdAt-b.createdAt);
const activeFicha=()=>get('fichas',cfg().activeFicha)||fichas().at(-1);
const sessions=()=>all('sessions').sort((a,b)=>(b.date+pad(0)).localeCompare(a.date+pad(0))||(b.start||0)-(a.start||0));
const doneSets=e=>e.sets.filter(s=>s.done);
const performed=s=>s.exercises.filter(e=>doneSets(e).length);
const volume=e=>doneSets(e).reduce((t,s)=>t+(s.load||0)*(s.reps||0),0);
const maxLoad=e=>{const v=doneSets(e).map(s=>s.load).filter(x=>x!=null);return v.length?Math.max(...v):null};
function catalog(){
  const m=new Map();
  for(const s of sessions().reverse())for(const e of s.exercises)m.set(e.exId,{exId:e.exId,name:e.name,group:e.group});
  for(const f of fichas())for(const w of f.workouts)for(const e of w.exercises)m.set(e.exId,{exId:e.exId,name:e.name,group:e.group});
  return [...m.values()].sort((a,b)=>a.name.localeCompare(b.name));
}
function exIdFor(name){return catalog().find(e=>norm(e.name)===norm(name))?.exId||uid()}
function pastOf(exId,exclude){
  const out=[];
  for(const s of sessions()){if(s.id===exclude)continue;
    const es=s.exercises.filter(e=>e.exId===exId&&doneSets(e).length);
    if(es.length){const e={...es[0],sets:es.flatMap(doneSets)};out.push({s,e})}}
  return out;
}
const e1rm=s=>(s.load||0)*(1+(s.reps||0)/30);
/* compara uma série com tudo o que veio antes */
function checkRecord(set,prior){
  if(!prior.length||set.load==null||!set.reps)return null;
  const loads=prior.map(s=>s.load).filter(x=>x!=null);
  if(loads.length&&set.load>Math.max(...loads)+1e-6)return {type:'load',text:wt(set.load)};
  const same=prior.filter(s=>s.load!=null&&Math.abs(s.load-set.load)<1e-6);
  if(same.length&&set.reps>Math.max(...same.map(s=>s.reps||0)))return {type:'reps',text:set.reps+' repetições com '+wt(set.load)};
  return null;
}
function recordEvents(){
  const seen={},out=[];
  for(const s of sessions().reverse()){
    for(const e of s.exercises){
      const prior=seen[e.exId]||(seen[e.exId]=[]);const mine=doneSets(e);
      const hits=mine.map(x=>checkRecord(x,prior)).filter(Boolean);
      const best=hits.filter(h=>h.type==='load').at(-1)||hits.at(-1);
      if(best)out.push({date:s.date,name:e.name,exId:e.exId,...best});
      prior.push(...mine);
    }
  }
  return out.reverse();
}
function workoutSecs(a,now=Date.now()){return Math.max(0,((a.pausedAt||now)-a.start-(a.pausedMs||0))/1000)}
function sessionFromPlan(f,w){
  return {id:uid(),fichaId:f?.id||null,workoutId:w?.id||null,letter:w?.letter||'',workoutName:w?.name||'Treino livre',groups:w?.groups||'',notes:'',demo:!!f?.demo,
    exercises:(w?.exercises||[]).map(entryFromPlan)};
}
function entryFromPlan(e){
  const last=pastOf(e.exId)[0]?.e.sets[0];
  const load=e.load??last?.load??null,reps=firstInt(e.reps)??last?.reps??null;
  return {key:uid(),exId:e.exId,name:e.name,group:e.group||'',rest:restOf(e),planned:{sets:e.sets,reps:e.reps,load:e.load},tip:e.notes||'',notes:'',
    sets:Array.from({length:Math.max(1,e.sets||1)},()=>({load,reps,done:false}))};
}
const WD=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const weekOrder=()=>Array.from({length:7},(_,i)=>(i+cfg().weekStart)%7);
const daysText=w=>weekOrder().filter(d=>w.days?.includes(d)).map(d=>WD[d]).join(', ');
const countEx=n=>n+(n===1?' exercício':' exercícios');
function nextWorkout(){
  const f=activeFicha();if(!f||!f.workouts.length)return null;
  const dow=new Date().getDay(),done=new Set(sessions().filter(s=>s.date===today()).map(s=>s.workoutId));
  const planned=f.workouts.find(w=>w.days?.includes(dow)&&!done.has(w.id));
  if(planned)return {f,w:planned,today:true};
  const last=sessions().find(s=>s.fichaId===f.id&&f.workouts.some(w=>w.id===s.workoutId));
  const i=last?(f.workouts.findIndex(w=>w.id===last.workoutId)+1)%f.workouts.length:0;
  return {f,w:f.workouts[i]};
}
function weekStartOf(d){const x=new Date(d);x.setHours(12,0,0,0);return addDays(x,-((x.getDay()-cfg().weekStart+7)%7))}

/* ===== gráficos ===== */
function lineChart(pts,label){
  if(!pts.length)return '<p class="muted">Ainda não há dados para o gráfico.</p>';
  const W=340,H=170,L=40,R=14,T=22,B=24;
  let lo=Math.min(...pts.map(p=>p.y)),hi=Math.max(...pts.map(p=>p.y));
  if(lo===hi){lo=Math.max(0,lo-1);hi=hi+1}
  const x=i=>pts.length===1?(L+W-R)/2:L+i*(W-L-R)/(pts.length-1);
  const y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  const path=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.y).toFixed(1)).join('');
  const idx=[...new Set([0,Math.floor((pts.length-1)/2),pts.length-1])];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
  ${[hi,(hi+lo)/2,lo].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e1e6ed"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${nf(Math.round(v*10)/10)}</text>`).join('')}
  <path d="${path}L${x(pts.length-1)} ${H-B}L${x(0)} ${H-B}Z" fill="#8cc8f2" opacity=".25"/>
  <path d="${path}" fill="none" stroke="#0f2a4a" stroke-width="2.5" stroke-linejoin="round"/>
  ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.y)}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?'#8cc8f2':'#0f2a4a'}" stroke="#0f2a4a" stroke-width="1.5"><title>${brs(p.x)}: ${nf(p.y)}</title></circle>`).join('')}
  ${idx.map(i=>`<text x="${x(i)}" y="${H-6}" text-anchor="${pts.length===1?'middle':i===0?'start':i===pts.length-1?'end':'middle'}">${brs(pts[i].x)}</text>`).join('')}</svg>`;
}
function barChart(items,label){
  if(!items.some(i=>i.v))return '<p class="muted">Sem registros neste período.</p>';
  const W=340,H=150,T=18,B=20,max=Math.max(...items.map(i=>i.v)),bw=(W-8)/items.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${items.map((it,i)=>{
    const h=(H-T-B)*it.v/max,cx=4+i*bw+bw/2;
    return `<rect x="${cx-bw*.33}" y="${H-B-h}" width="${bw*.66}" height="${Math.max(h,1)}" rx="3" fill="${it.v?'#1c4373':'#e1e6ed'}"/>
    ${it.v&&items.length<=14?`<text x="${cx}" y="${H-B-h-4}" text-anchor="middle">${esc(it.t??nf(it.v))}</text>`:''}
    <text x="${cx}" y="${H-5}" text-anchor="middle">${esc(it.l)}</text>`}).join('')}</svg>`;
}

A.editEx=el=>{
  const f=curFicha(),w=f.workouts[+el.dataset.w],i=+el.dataset.i,old=i>=0?w.exercises[i]:null;
  const e=old||{name:'',group:'',sets:3,reps:'12',load:null,rest:null,notes:''};
  const preset=e.rest==null?'':RESTS.includes(e.rest)?e.rest:'x';
  openSheet({title:old?'Editar exercício':'Novo exercício',model:{...e,preset,custom:preset==='x'?e.rest:''},
  render:m=>dataList()+field('Exercício','name',m.name,'list="dl-ex" autocomplete="off"')+field('Grupo muscular','group',m.group,'list="dl-gr"')+
   `<div class="grid3">${field('Séries','sets',m.sets,'inputmode="numeric"')}${field('Repetições','reps',m.reps,'placeholder="10-12"')}${field('Carga ('+cfg().unit+')','load',iu(m.load),'inputmode="decimal" data-type="load"')}</div>

    }else if(old&&norm(old.name)!==norm(name))exId=null;
    const rest=m.preset===''?null:m.preset==='x'?(firstInt(m.custom)||null):Number(m.preset);
    const doc={id:old?.id||uid(),exId:exId||exIdFor(name),name,group:m.group.trim(),sets:Math.min(20,Math.max(1,firstInt(m.sets)||1)),reps:String(m.reps).trim(),load:m.load,rest,notes:m.notes.trim()};
    if(old)w.exercises[i]=doc;else w.exercises.push(doc);closeSheet();saveFicha(f);
  }});
};

function exDetail(id){

  ${s.notes?`<p><b>Observações:</b> ${esc(s.notes)}</p>`:''}

A.session=el=>{const id=el.dataset.id;openSheet({title:()=>{const s=get('sessions',id);return s?br(s.date)+' · '+sTitle(s):'Registro excluído'},render:()=>{const s=get('sessions',id);return s?sessionBody(s):'<p class="muted">Este registro não existe mais.</p>'}})};

/* registro manual e edição */
function planChoices(){return [['','Treino livre'],...fichas().flatMap(f=>f.workouts.map(w=>[f.id+'|'+w.id,`${f.name}: ${w.letter} — ${w.name}`]))]}
function applyPlan(m,val){
  const[fid,wid]=val.split('|'),f=get('fichas',fid),w=f?.workouts.find(x=>x.id===wid);
  const s=sessionFromPlan(f,w);s.exercises.forEach(e=>e.sets.forEach(x=>x.done=true));
  Object.assign(m,{fichaId:s.fichaId,workoutId:s.workoutId,letter:s.letter,workoutName:s.workoutName,groups:s.groups,demo:s.demo,exercises:s.exercises});
}
function sessionEditor(src,isNew){
  const m=structuredClone(src);m.startT=hm(m.start);m.endT=hm(m.end);m.pauseMin=Math.round((m.pausedMs||0)/60000);m.choice='';
  if(!isNew)m.exercises.forEach(e=>e.sets=e.sets.filter(s=>s.done));
  openSheet({title:isNew?'Registrar treino anterior':'Editar treino',model:m,
  render:m=>dataList()+(isNew?`<label>Treino da ficha<select data-bind="choice" data-plan>${opts(planChoices(),m.choice)}</select></label>`:'')+
   field('Nome do treino','workoutName',m.workoutName)+field('Data','date',m.date,'type="date" max="'+today()+'"')+
   `<div class="grid3">${field('Início','startT',m.startT,'type="time"')}${field('Término','endT',m.endT,'type="time"')}${field('Pausa (min)','pauseMin',m.pauseMin,'inputmode="numeric" data-type="num"')}</div>`+
   m.exercises.map((e,i)=>`<div class="card"><div class="row">${`<label class="grow">Exercício<input data-bind="exercises.${i}.name" data-old="${esc(e.name)}" list="dl-ex" value="${esc(e.name)}"></label>`}<button class="ib" aria-label="Remover exercício" data-act="seDelEx" data-i="${i}">×</button></div>
     <div class="setrow head"><span>Série</span><span>Carga (${cfg().unit})</span><span>Reps</span><span></span></div>
     ${e.sets.map((s,j)=>`<div class="setrow"><b>${j+1}</b><input aria-label="Carga" inputmode="decimal" data-type="load" data-bind="exercises.${i}.sets.${j}.load" value="${iu(s.load)}"><input aria-label="Repetições" inputmode="numeric" data-type="num" data-bind="exercises.${i}.sets.${j}.reps" value="${s.reps??''}"><button class="ib" aria-label="Remover série" data-act="seDelSet" data-i="${i}" data-j="${j}">×</button></div>`).join('')}
     ${btn('seAddSet','+ Série','line sm',`data-i="${i}"`)}<label>Observação<input data-bind="exercises.${i}.notes" value="${esc(e.notes)}"></label></div>`).join('')+
   btn('seAddEx','+ Adicionar exercício','sec')+`<label>Observações do treino<textarea data-bind="notes">${esc(m.notes)}</textarea></label>`+btn('submit','Salvar registro','block'),
  submit(m){
    if(!m.date||m.date>today())return toast('Escolha uma data até hoje.');
    const at=t=>{if(!t)return null;const[h,mi]=t.split(':').map(Number),d=dateOf(m.date);d.setHours(h,mi,0,0);return d.getTime()};
    const start=at(m.startT);let end=at(m.endT);if(start&&end&&end<start)end+=864e5;
    const pausedMs=(m.pauseMin||0)*60000,doc={...m,start,end,pausedMs};
    const unchanged=!isNew&&m.date===src.date&&m.startT===hm(src.start)&&m.endT===hm(src.end)&&m.pauseMin===Math.round((src.pausedMs||0)/60000);
    doc.durationSec=unchanged?src.durationSec:start&&end?Math.max(0,Math.round((end-start-pausedMs)/1000)):null;
    if(unchanged){doc.start=src.start;doc.end=src.end;doc.pausedMs=src.pausedMs||0}
    delete doc.startT;delete doc.endT;delete doc.pauseMin;delete doc.choice;
    doc.workoutName=doc.workoutName.trim()||'Treino';
    doc.exercises=doc.exercises.filter(e=>e.name.trim()&&e.sets.length).map(e=>{
      const orig=src.exercises.find(o=>o.key===e.key);
      if(!orig||norm(orig.name)!==norm(e.name))e.exId=exIdFor(e.name.trim());
      return {...e,name:e.name.trim(),sets:e.sets.map(s=>({...s,done:true}))}});
    put('sessions',doc);closeSheet();topSheet()?.refresh();render();toast('Registro salvo.');
  }});
}

A.start=async el=>{

let audio=null,beeps=[],beepFor=null;
function unlockAudio(){try{audio||=new (window.AudioContext||window.webkitAudioContext)();if(audio.state!=='running')audio.resume().then(scheduleBeep).catch(()=>{})}catch(e){}}
function stopBeep(){beeps.forEach(o=>{try{o.stop()}catch(e){}});beeps=[];beepFor=null}
function tone(delay){

function scheduleBeep(){

  if(!r||r.paused!=null||!cfg().sound||r.endAt<=Date.now()){if(!r||r.paused!=null||!cfg().sound)stopBeep();return}
  if(beepFor===r.endAt||!audio||audio.state!=='running')return;
  stopBeep();tone((r.endAt-Date.now())/1000);beepFor=r.endAt;
}

    box.innerHTML=ended?`<div role="alert" class="row between"><h3>Descanso finalizado! Próxima série</h3></div><div class="row" style="margin-top:8px">${btn('rAdd','+15 s','','data-s="15"')}${btn('rRestart','Reiniciar')}${btn('rStop','OK')}</div>`
    :`<div class="row between"><span>${r.paused!=null?'Descanso pausado':'Descansando'}<br><small>${esc(r.name)}</small></span><span class="clock" data-timer="rest"></span></div><div class="bar" style="background:#ffffff30;margin:8px 0"><i id="restbar" style="background:var(--sky)"></i></div><div class="row" style="gap:5px">${btn('rPause',r.paused!=null?'Retomar':'Pausar')}${btn('rRestart','Reiniciar')}${btn('rAdd','+15 s','','data-s="15"')}${btn('rAdd','+30 s','','data-s="30"')}${btn('rStop','Encerrar')}</div>`}
  if(!ended){$('[data-timer="rest"]',box).textContent=clock(Math.ceil(restLeft(r)/1000));$('#restbar').style.width=Math.min(100,restLeft(r)/r.total*100)+'%'}

function buckets(p){

  if(p==='semana'){const s=weekStartOf(now);for(let i=0;i<7;i++){const d=ymd(addDays(s,i));out.push({a:d,b:d,l:d.slice(8)})}}
  else if(p==='ano'){for(let m=0;m<12;m++)out.push({a:ymd(new Date(now.getFullYear(),m,1)),b:ymd(new Date(now.getFullYear(),m+1,0)),l:MONTHS[m].slice(0,3)})}
  else if(p==='mes'){const a=new Date(now.getFullYear(),now.getMonth(),1,12),b=new Date(now.getFullYear(),now.getMonth()+1,0,12);
    for(let s=a;s<=b;){let e=addDays(weekStartOf(s),6);if(e>b)e=b;out.push({a:ymd(s),b:ymd(e),l:s.getDate()+'–'+e.getDate()});s=addDays(e,1)}}

async function toJpeg(src,max,q=.85){
  let bmp=src;if(src instanceof Blob)bmp=await createImageBitmap(src);
  const k=Math.min(1,max/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,'image/jpeg',q));
}
async function addPhoto(file,measureId){
  try{let size=1000,q=.8,src;
    do{const b=await toJpeg(file,size,q);src=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});size*=.82;q-=.05}while(src.length>170000&&size>200);
    put('photos',{id:uid(),measureId,src});render();toast('Foto adicionada.')}
  catch(e){toast('Não consegui abrir esta imagem. Tente um arquivo JPG ou PNG.')}
}

async function restore(file){
  try{
    const b=JSON.parse(await file.text());if(!['mfit','diario-treino'].includes(b.app)||!b.data)throw 0;
    const okId=id=>/^[A-Za-z0-9_-]{1,60}$/.test(id);
    const items=COLS.flatMap(c=>Object.values(b.data[c]||{}).filter(d=>d&&okId(d.id)).map(d=>[c,d]));
    /* ids entram em atributos HTML: recusa qualquer id fora do padrão */
    const bad=(o)=>o&&typeof o==='object'&&Object.entries(o).some(([k,v])=>(/^(id|exId|key|fichaId|workoutId|measureId|activeFicha)$/.test(k)&&v!=null&&!okId(v))||(k==='date'&&!/^\d{4}-\d{2}-\d{2}$/.test(v))||(/^(sets|reps)$/.test(k)&&typeof v==='string'&&v.length>40)||bad(v));
    if(!items.length||items.some(([c,d])=>bad(d)))throw 0;
    const add=items.filter(([c,d])=>c!=='state'||d.id==='settings').filter(([c,d])=>!get(c,d.id));
    const clash=items.filter(([c,d])=>c!=='state'&&get(c,d.id)).length;
    const r=await ask('Restaurar backup',`${add.length} item(ns) novo(s) e ${clash} já existente(s).`,[['Só adicionar o que falta','add',''],...(clash?[['Substituir os existentes pelos do backup','all','line']]:[]),['Cancelar',null,'line']]);
    if(!r)return;
    /* num app ainda vazio, o backup também traz as preferências */
    const fresh=!all('fichas').length&&!all('sessions').length&&!all('measures').length,prefs=b.data.state?.settings;
    (r==='all'?items.filter(([c,d])=>c!=='state'||d.id==='settings'):add).forEach(([c,d])=>put(c,d));
    if(fresh&&prefs)setCfg({...prefs,id:'settings',name:cfg().name||prefs.name||''});render();toast('Backup restaurado.');
  }catch(e){toast('Este arquivo não é um backup válido do app.')}
}

document.addEventListener('input',ev=>{

    if(d.note==='session')a.notes=el.value;
    else if(d.note)cur(a).notes=el.value;
    else{const sets=cur(a).sets,j=+d.j,old=sets[j][d.set],v=d.set==='load'?fromU(el.value):num(el.value);sets[j][d.set]=v;
      /* repete o valor nas próximas séries ainda não feitas */
      if(d.set==='load'){const base=el.dataset.base===undefined?old:(el.dataset.base===''?null:+el.dataset.base);el.dataset.base=base??'';
        for(let k=j+1;k<sets.length;k++){const inp=$('#load-'+k);if(!sets[k].done&&(sets[k].load===base||inp?.dataset.follow==='1')){sets[k].load=v;if(inp){inp.value=el.value;inp.dataset.follow='1'}}}}}
    saveActive(a);
  }

const meta={get:k=>run('meta','readonly',s=>s.get(k)),set:(k,v)=>run('meta','readwrite',s=>s.put(v,k)),del:k=>run('meta','readwrite',s=>s.delete(k))};
const ITER=250000;
async function derive(password,salt,iterations){
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password.normalize('NFC')),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations},key,256));
}
const same=(a,b)=>a.length===b.length&&a.reduce((d,x,i)=>d|(x^b[i]),0)===0;
async function makeSecret(password){const salt=crypto.getRandomValues(new Uint8Array(16));return {salt,iterations:ITER,hash:await derive(password,salt,ITER)}}

async function submitAuth(){
  const v=id=>$('#'+id)?.value||'',fail=m=>{const e=$('#a-err');e.textContent=m;e.hidden=false};
  const b=$('#authform [type=submit]');if(b.disabled)return;
  const user=v('a-user').trim(),pass=v('a-pass'),keep=$('#a-keep').checked;
  if(!user||!pass)return fail('Preencha o usuário e a senha.');
  if(!Auth.account){
    if(!v('a-name').trim())return fail('Digite seu nome.');
    if(pass.length<6)return fail('A senha precisa ter pelo menos 6 caracteres.');
    if(pass!==v('a-pass2'))return fail('As senhas não são iguais.');
  }
  b.disabled=true;
  try{
    if(Auth.account){
      const ac=Auth.account,ok=same(await derive(pass,ac.salt,ac.iterations),ac.hash);
      if(!ok||norm(user)!==norm(ac.username)){b.disabled=false;return fail('Usuário ou senha incorretos.')}
    }else{
      const account={id:uid(),username:user,name:v('a-name').trim(),...await makeSecret(pass)};
      /* confere de novo: outra janela pode ter criado a conta */
      if(await meta.get('account')){location.reload();return}
      await meta.set('account',account);Auth.account=account;
    }
    if(keep)await meta.set('session',Auth.account.id);else{await meta.del('session');sessionStorage.setItem('mfit-session',Auth.account.id)}
    await enter();
  }catch(e){b.disabled=false;fail('Não foi possível acessar o armazenamento deste aparelho. Feche a navegação anônima e tente de novo.')}
}

  render();setInterval(tick,250);
  navigator.storage?.persist?.().catch(()=>{});
}

/* arquivos: exportação sem depender de internet */
const MIME={xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',pdf:'application/pdf',json:'application/json'};
save=async function(filename,data){
  const type=MIME[filename.split('.').pop()],file=new File([data],filename,{type});
  if(matchMedia('(pointer: coarse)').matches&&navigator.canShare?.({files:[file]})){
    try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=filename;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),60000);toast('Arquivo gerado. Confira os downloads do aparelho.');
};
const CRC=Array.from({length:256},(_,n)=>{for(let k=0;k<8;k++)n=n&1?0xedb88320^(n>>>1):n>>>1;return n>>>0});
function zip(files){
  const enc=new TextEncoder(),parts=[],dir=[];let off=0;
  const head=(len,fields)=>{const b=new Uint8Array(len),v=new DataView(b.buffer);for(const[p,s,x]of fields)s===2?v.setUint16(p,x,true):v.setUint32(p,x,true);return b};
  for(const[name,text]of files){
    const n=enc.encode(name),d=enc.encode(text);let c=~0;for(const x of d)c=CRC[(c^x)&255]^(c>>>8);c=~c>>>0;
    const local=head(30,[[0,4,0x04034b50],[4,2,20],[6,2,0x800],[12,2,33],[14,4,c],[18,4,d.length],[22,4,d.length],[26,2,n.length]]);
    dir.push(head(46,[[0,4,0x02014b50],[4,2,20],[6,2,20],[8,2,0x800],[14,2,33],[16,4,c],[20,4,d.length],[24,4,d.length],[28,2,n.length],[42,4,off]]),n);
    parts.push(local,n,d);off+=30+n.length+d.length;
  }
  const size=dir.reduce((t,x)=>t+x.length,0);
  return new Blob([...parts,...dir,head(22,[[0,4,0x06054b50],[8,2,files.length],[10,2,files.length],[12,4,size],[16,4,off]])]);
}
function workbook(sheetsData){
  const x=s=>String(s??'').replace(/[^\t\n\r\x20-퟿-�\u{10000}-\u{10FFFF}]/gu,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const col=i=>i<26?String.fromCharCode(65+i):col(Math.floor(i/26)-1)+col(i%26);
  const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',NS='http://schemas.openxmlformats.org/',R=NS+'officeDocument/2006/relationships',M=NS+'spreadsheetml/2006/main',CT='application/vnd.openxmlformats-officedocument.spreadsheetml.';
  const sheet=([,h,rows])=>`${X}<worksheet xmlns="${M}"><cols>${h.map((v,i)=>`<col min="${i+1}" max="${i+1}" width="${Math.max(14,v.length+3)}" customWidth="1"/>`).join('')}</cols><sheetData>${[h,...rows].map((r,i)=>`<row r="${i+1}">${r.map((v,j)=>{const ref=col(j)+(i+1),st=i?'':' s="1"';return typeof v==='number'&&Number.isFinite(v)?`<c r="${ref}"${st}><v>${v}</v></c>`:`<c r="${ref}"${st} t="inlineStr"><is><t xml:space="preserve">${x(v)}</t></is></c>`}).join('')}</row>`).join('')}</sheetData></worksheet>`;
  return zip([
    ['[Content_Types].xml',`${X}<Types xmlns="${NS}package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="${CT}sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="${CT}styles+xml"/>${sheetsData.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="${CT}worksheet+xml"/>`).join('')}</Types>`],
    ['_rels/.rels',`${X}<Relationships xmlns="${NS}package/2006/relationships"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ['xl/workbook.xml',`${X}<workbook xmlns="${M}" xmlns:r="${R}"><sheets>${sheetsData.map(([n],i)=>`<sheet name="${x(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`],
    ['xl/_rels/workbook.xml.rels',`${X}<Relationships xmlns="${NS}package/2006/relationships">${sheetsData.map((s,i)=>`<Relationship Id="rId${i+1}" Type="${R}/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheetsData.length+1}" Type="${R}/styles" Target="styles.xml"/></Relationships>`],
    ['xl/styles.xml',`${X}<styleSheet xmlns="${M}"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="2"><xf xfId="0"/><xf xfId="0" fontId="1" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`],
    ...sheetsData.map((s,i)=>[`xl/worksheets/sheet${i+1}.xml`,sheet(s)])
  ]);
}

let pdfLib=null;
const loadPdf=()=>pdfLib||=new Promise((ok,no)=>{const s=document.createElement('script');s.src='./pdf-lib.min.js';s.onload=()=>ok(window.PDFLib);s.onerror=()=>{pdfLib=null;s.remove();no()};document.head.append(s)});
async function makePdf(){
  const{PDFDocument,StandardFonts,rgb}=await loadPdf(),doc=await PDFDocument.create();
  const font=await doc.embedFont(StandardFonts.Helvetica),bold=await doc.embedFont(StandardFonts.HelveticaBold);
  const navy=rgb(.06,.16,.29),line=rgb(.88,.9,.93),W=842,H=595,M=28,F=8;
  const clean=v=>String(v??'').replace(/[—–]/g,'-').replace(/→/g,'->').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').replace(/[^\x20-\x7E\xA0-\xFF]/g,'?');
  let page,y;const add=()=>{page=doc.addPage([W,H]);y=H-M};add();
  const text=(t,x,yy,size,f=font,color=navy)=>page.drawText(t,{x,y:yy,size,font:f,color});
  const wrap=(v,w,f)=>{const out=[];let cur='';for(let word of clean(v).split(' ')){const t=cur?cur+' '+word:word;if(f.widthOfTextAtSize(t,F)<=w){cur=t;continue}if(cur)out.push(cur);while(f.widthOfTextAtSize(word,F)>w){let n=word.length-1;while(n>1&&f.widthOfTextAtSize(word.slice(0,n),F)>w)n--;out.push(word.slice(0,n));word=word.slice(n)}cur=word}out.push(cur);return out};
  text(clean('M.Fit - '+br(today())+(demoNote()?' (contém dados de demonstração)':'')),M,y-14,16,bold);y-=34;
  for(const[title,h,rows]of tables()){
    if(!rows.length)continue;
    const weight=h.map((v,i)=>Math.min(32,Math.max(7,v.length,...rows.slice(0,200).map(r=>String(r[i]??'').length)))),sum=weight.reduce((a,b)=>a+b,0),ws=weight.map(w=>(W-2*M)*w/sum);
    const row=(cells,header)=>{
      const f=header?bold:font,lines=cells.map((c,i)=>wrap(c,ws[i]-6,f)),n=Math.max(...lines.map(l=>l.length)),hgt=Math.min(n,40)*10+5;
      if(y-hgt<M){add();if(!header)row(h,true)}
      if(header)page.drawRectangle({x:M,y:y-hgt,width:W-2*M,height:hgt,color:navy});
      let x=M;lines.forEach((l,i)=>{l.slice(0,40).forEach((t,k)=>text(t,x+3,y-10-k*10,F,f,header?rgb(1,1,1):navy));x+=ws[i]});
      y-=hgt;page.drawLine({start:{x:M,y},end:{x:W-M,y},thickness:.5,color:line});
    };
    if(y<M+80)add();
    text(clean(title),M,y-12,12,bold);y-=20;row(h,true);rows.forEach(r=>row(r,false));y-=14;
  }
  return doc.save();
}
A.pdf=async()=>{try{toast('Gerando o PDF…',2000);await save(`mfit-treinos-${today()}${demoNote()}.pdf`,await makePdf())}catch(e){toast('Não consegui gerar o PDF.')}};
